# Plain HTTP on port 8080 by default. Pick another with PORT, e.g.  PORT=8090 docker compose up -d --build
# (or put PORT=8090 in a file named .env next to this one).
# Fine for a home network or behind your own reverse proxy.
# For automatic HTTPS (needed to install it as an app on a phone), use docker-compose.https.yml.
services:
  grudge-ledger:
    build: .
    image: grudge-ledger
    container_name: grudge-ledger
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
