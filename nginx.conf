server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # Always revalidate the page, service worker and manifest so updates show up.
  location = / { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  location = /index.html { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  location = /sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options nosniff always; }
  location = /manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }
  location /fonts/ { add_header Cache-Control "public, max-age=31536000, immutable" always; }
  location /icons/ { add_header Cache-Control "public, max-age=86400" always; }
}
